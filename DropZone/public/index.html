<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><title>C://DropZone</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;background:#000;color:#e0e0e0;font-size:13px;height:100vh;display:flex;flex-direction:column;user-select:none}
#navbar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#000;border-bottom:1px solid #3a3a3a}
.nav{font-size:16px;color:#ccc;cursor:pointer;padding:0 4px}.nav.off{color:#555;cursor:default}
#addr{flex:1;display:flex;align-items:center;gap:6px;background:#000;border:1px solid #3a3a3a;border-radius:4px;padding:5px 10px;overflow:hidden;white-space:nowrap}
#addr{cursor:text}#addr input{flex:1;background:none;border:0;outline:0;color:#ccc;font:inherit;padding:0}#addr span{cursor:pointer}#addr span:hover{color:#8ab4f8}#addr i{color:#666;font-style:normal}
#search{width:220px;background:#000;border:1px solid #3a3a3a;border-radius:4px;padding:5px 10px;color:#ccc;font:inherit;user-select:text}
#toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;background:#000;border-bottom:1px solid #3a3a3a;position:relative}
#toolbar button{background:none;border:none;padding:6px 10px;border-radius:4px;cursor:pointer}
#toolbar button:hover:not(:disabled){background:#1a1a1a}#toolbar button:disabled{cursor:default}#toolbar button:disabled svg{opacity:.3}#toolbar svg{width:18px;height:18px;display:block;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sortmenu{display:none;position:absolute;top:34px;background:#000;border:1px solid #444;border-radius:6px;padding:4px 0;z-index:5;min-width:130px}
#sortmenu div{padding:6px 14px;cursor:pointer}#sortmenu div:hover{background:#1a1a1a}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:230px;background:#000;border-right:1px solid #3a3a3a;padding:8px 0;overflow:auto}
#sidebar .item{display:flex;align-items:center;gap:6px;padding:5px 8px;color:#ccc;cursor:pointer;white-space:nowrap}
#sidebar .item:hover,#sidebar .item.on{background:#1a1a1a}
#sidebar .item span{overflow:hidden;text-overflow:ellipsis}
#sidebar svg{flex:none}
.chev{width:16px;height:16px;fill:none;stroke:#ccc;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .1s}
.chev.open{transform:rotate(90deg)}
.ico{width:20px;height:20px}
#content{flex:1;overflow-y:auto;position:relative}
body.drag #content{outline:2px dashed #0a84ff;outline-offset:-4px}
#status{padding:6px 12px;color:#9c9c9c;min-height:26px}
progress{width:200px;height:4px;vertical-align:middle;margin-left:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;padding:6px 12px;border-bottom:1px solid #3a3a3a;color:#b0b0b0;font-size:12px;position:sticky;top:0;background:#000;cursor:pointer}
td{padding:5px 12px;border-bottom:1px solid #1a1a1a;white-space:nowrap;color:#9c9c9c}
input.ren{width:100%;background:#000;border:1px solid #8ab4f8;color:#fff;font:inherit;padding:1px 4px;outline:0;box-sizing:border-box}td:first-child{color:#e0e0e0;max-width:0;width:45%;overflow:hidden;text-overflow:ellipsis}
tr.row:hover{background:#141414}tr.row.sel{background:#0b3a63}
.tgt{background:#0b3a63!important}
#empty{padding:30px;text-align:center;color:#666}
</style></head><body>
<div id="navbar">
  <span class="nav" id="back">←</span><span class="nav" id="fwd">→</span><span class="nav" id="up">↑</span><span class="nav" id="refresh">⟳</span>
  <div id="addr"></div>
  <input id="search" placeholder="Rechercher dans ce dossier"><a href="/auth/logout" style="color:#ccc;text-decoration:none" title="Déconnexion">⏻</a>
</div>
<div id="toolbar">
  <button id="bNew" title="Nouveau dossier" aria-label="Nouveau dossier"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></button><button id="bDl" title="Télécharger" aria-label="Télécharger"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button><button id="bCut" title="Couper" aria-label="Couper"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></button><button id="bCopy" title="Copier" aria-label="Copier"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button><button id="bPaste" title="Coller" aria-label="Coller"><svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></button><button id="bRen" title="Renommer" aria-label="Renommer"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button id="bShare" title="Partager (copier le lien)" aria-label="Partager (copier le lien)"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button><button id="bDel" title="Supprimer" aria-label="Supprimer"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button><button id="bSort" title="Trier" aria-label="Trier"><svg viewBox="0 0 24 24"><path d="M7 4v16"/><polyline points="3 16 7 20 11 16"/><path d="M17 20V4"/><polyline points="13 8 17 4 21 8"/></svg></button>
  <div id="sortmenu"><div data-k="name">Nom</div><div data-k="date">Modifié le</div><div data-k="type">Type</div><div data-k="size">Taille</div></div>
  <input type="file" id="fileInput" multiple style="display:none">
</div>
<div id="main">
  <div id="sidebar"></div>
  <div id="content">
    <div id="status"></div><progress id="progress" value="0" max="100" style="display:none"></progress>
    <table><thead><tr><th data-k="name">Nom</th><th data-k="date">Modifié le</th><th data-k="type">Type</th><th data-k="size">Taille</th></tr></thead><tbody id="list"></tbody></table>
    <div id="empty" style="display:none">Ce dossier est vide. Glisse des fichiers ici ou crée un dossier.</div>
  </div>
</div>
<script>
const CHUNK=20*1024*1024,$=id=>document.getElementById(id);
let cwd='',hist=[''],hi=0,entries=[],sel=new Set(),clip=null,sort={k:'name',d:1},q='';
let drag=null;const open=new Set(['']);
const CHEV='<svg class="chev%O%" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg>';
const FOLDER='<svg class="ico" viewBox="0 0 24 24"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v2H2z" fill="#e0a92a"/><rect x="2" y="8" width="20" height="11" rx="2" fill="#f7c948"/><rect x="2" y="16" width="20" height="3" rx="1.5" fill="#3fa34d"/></svg>';
const DRIVE='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="12" width="20" height="8" rx="2"/><path d="M4 12l3-7h10l3 7"/><circle cx="6.5" cy="16" r=".8" fill="#ccc"/></svg>';
const okName=n=>n&&!/[\\/:*?"<>|]/.test(n)&&!n.startsWith('.')&&n.trim()===n;
function target(el,dest){
  el.ondragover=ev=>{if(!drag)return;ev.preventDefault();ev.stopPropagation();el.classList.add('tgt')};
  el.ondragleave=()=>el.classList.remove('tgt');
  el.ondrop=async ev=>{
    if(!drag)return;ev.preventDefault();ev.stopPropagation();el.classList.remove('tgt');
    const items=drag.filter(p=>p!==dest&&!dest.startsWith(p+'/'));drag=null;
    try{if(items.length)await post('/api/paste',{items,dest,copy:false});await load()}catch(e){say('Erreur : '+e.message)}
  };
}
const join=(a,b)=>a?a+'/'+b:b;
const say=t=>$('status').textContent=t||'';
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{if(r.status===401)location='/auth/login';const d=await r.json();if(!r.ok)throw new Error(d.error||'erreur');return d});
const list=p=>fetch('/api/list?path='+encodeURIComponent(p)).then(async r=>{if(r.status===401)location='/auth/login';const d=await r.json();if(!r.ok)throw new Error(d.error);return d});
const fsize=b=>b<1024?b+' o':b<1024**2?(b/1024).toFixed(1)+' Ko':b<1024**3?(b/1024**2).toFixed(1)+' Mo':(b/1024**3).toFixed(2)+' Go';
const fdate=d=>new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const ftype=e=>e.dir?'Dossier de fichiers':(e.name.includes('.')?e.name.split('.').pop().toUpperCase():'Fichier');
const act=f=>async()=>{try{await f()}catch(e){say('Erreur : '+e.message)}};

async function load(){
  try{entries=await list(cwd);say()}catch(e){entries=[];say('Erreur : '+e.message)}
  sel.clear();render();side();
}
function go(p,push=true){
  cwd=p;if(push){hist=hist.slice(0,hi+1);hist.push(p);hi=hist.length-1}
  q='';$('search').value='';return load();
}
let editing=false;
function render(){
  const segs=cwd?cwd.split('/'):[];
  if(!editing){$('addr').innerHTML='<span data-p="">C://DropZone</span>'+segs.map((s,i)=>'<i>›</i><span data-p="'+encodeURIComponent(segs.slice(0,i+1).join('/'))+'">'+esc(s)+'</span>').join('');
  $('addr').querySelectorAll('span').forEach(s=>{const p=decodeURIComponent(s.dataset.p);s.onclick=()=>go(p);target(s,p)})}
  $('back').classList.toggle('off',hi===0);$('fwd').classList.toggle('off',hi>=hist.length-1);$('up').classList.toggle('off',!cwd);
  const v=entries.filter(e=>e.name.toLowerCase().includes(q.toLowerCase()));
  const key={name:e=>e.name.toLowerCase(),date:e=>+new Date(e.date),type:e=>ftype(e).toLowerCase(),size:e=>e.size}[sort.k];
  v.sort((a,b)=>(b.dir-a.dir)||(key(a)>key(b)?1:key(a)<key(b)?-1:0)*sort.d);
  const tb=$('list');tb.innerHTML='';
  v.forEach(e=>{
    const tr=document.createElement('tr');tr.className='row'+(sel.has(e.name)?' sel':'');
    tr.innerHTML='<td>'+esc(e.name)+'</td><td>'+fdate(e.date)+'</td><td>'+ftype(e)+'</td><td>'+(e.dir?'':fsize(e.size))+'</td>';
    tr.onclick=ev=>{ev.stopPropagation();if(ev.ctrlKey||ev.metaKey)sel.has(e.name)?sel.delete(e.name):sel.add(e.name);else{sel.clear();sel.add(e.name)}render()};
    tr.ondblclick=()=>e.dir?go(join(cwd,e.name)):download(e.name);
    tr.draggable=true;
    tr.ondragstart=ev=>{if(!sel.has(e.name)){sel.clear();sel.add(e.name)}drag=[...sel].map(n=>join(cwd,n));ev.dataTransfer.setData('text/plain','dz');ev.dataTransfer.effectAllowed='move'};
    tr.ondragend=()=>{drag=null};
    if(e.dir)target(tr,join(cwd,e.name));
    tb.appendChild(tr);
  });
  $('empty').style.display=v.length?'none':'block';
  const n=sel.size,one=n===1,f=[...sel].map(x=>entries.find(e=>e.name===x)).filter(Boolean);
  $('bDl').disabled=!f.some(e=>!e.dir);$('bCut').disabled=$('bCopy').disabled=$('bDel').disabled=!n;
  $('bRen').disabled=!one;$('bShare').disabled=!(one&&f[0]&&!f[0].dir);$('bPaste').disabled=!clip;
}
async function side(){
  const parts=cwd?cwd.split('/'):[];
  for(let i=1;i<parts.length;i++)open.add(parts.slice(0,i).join('/'));
  const rows=[];
  async function walk(p,name,depth){
    const isOpen=open.has(p);rows.push({p,name,depth,isOpen});
    if(!isOpen)return;
    const all=(await list(p).catch(()=>[])).sort((a,b)=>a.name.localeCompare(b.name));
    for(const e of all.filter(e=>e.dir))await walk(join(p,e.name),e.name,depth+1);
    for(const e of all.filter(e=>!e.dir))rows.push({p:join(p,e.name),name:e.name,depth:depth+1,file:true,parent:p});
  }
  await walk('','DropZone',0);
  $('sidebar').innerHTML=rows.map(r=>'<div class="item'+(r.p===cwd?' on':'')+'" data-p="'+encodeURIComponent(r.p)+'" style="padding-left:'+(8+r.depth*16)+'px">'+(r.file?'<i style="width:16px;flex:none"></i>':CHEV.replace('%O%',r.isOpen?' open':''))+'<span>'+esc(r.name)+'</span></div>').join('');
  $('sidebar').querySelectorAll('.item').forEach(i=>{
    const p=decodeURIComponent(i.dataset.p);
    const r=rows.find(x=>x.p===p);
    if(r.file){
      i.onclick=async()=>{await go(r.parent);sel.clear();sel.add(r.name);render()};
      i.ondblclick=()=>download(r.name,r.parent);
      return;
    }
    i.onclick=()=>go(p);
    i.querySelector('.chev').onclick=ev=>{ev.stopPropagation();open.has(p)?open.delete(p):open.add(p);side()};
    target(i,p);
  });
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const dlUrl=(n,d=cwd)=>location.origin+'/api/download?path='+encodeURIComponent(join(d,n));
function download(n,d=cwd){const a=document.createElement('a');a.href=dlUrl(n,d);a.download=n;document.body.appendChild(a);a.click();a.remove()}

$('back').onclick=()=>{if(hi>0){hi--;go(hist[hi],false)}};
$('fwd').onclick=()=>{if(hi<hist.length-1){hi++;go(hist[hi],false)}};
$('up').onclick=()=>{if(cwd)go(cwd.split('/').slice(0,-1).join('/'))};
$('refresh').onclick=load;
$('addr').onclick=ev=>{
  if(editing||ev.target.closest('span'))return;
  editing=true;
  const a=$('addr'),i=document.createElement('input'),root='C://DropZone';
  i.value=root+(cwd?'/'+cwd:'');a.innerHTML='';a.appendChild(i);i.focus();i.select();
  const end=()=>{if(!editing)return;editing=false;render()};
  i.onkeydown=async e=>{
    if(e.key==='Escape')return end();
    if(e.key!=='Enter')return;
    let p=i.value.trim().replace(/\\/g,'/');
    if(p.toLowerCase().startsWith(root.toLowerCase()))p=p.slice(root.length);
    p=p.split('/').filter(Boolean).join('/');
    try{await list(p);editing=false;go(p)}catch(err){say('Erreur : dossier introuvable')}
  };
  i.onblur=end;
};
$('search').oninput=e=>{q=e.target.value;render()};
$('content').onclick=()=>{sel.clear();render()};
document.querySelectorAll('th').forEach(t=>t.onclick=()=>setSort(t.dataset.k));
function setSort(k){sort.d=sort.k===k?-sort.d:1;sort.k=k;render()}
$('bSort').onclick=e=>{e.stopPropagation();$('sortmenu').style.display=$('sortmenu').style.display==='block'?'none':'block'};
document.querySelectorAll('#sortmenu div').forEach(d=>d.onclick=()=>{setSort(d.dataset.k);$('sortmenu').style.display='none'});
document.addEventListener('click',()=>$('sortmenu').style.display='none');

$('bNew').onclick=act(async()=>{const n=prompt('Nom du nouveau dossier');if(!n)return;if(!okName(n))throw new Error('nom invalide');await post('/api/mkdir',{path:cwd,name:n});await load()});
$('fileInput').onchange=e=>{upload([...e.target.files]);e.target.value=''};
$('bDl').onclick=()=>[...sel].filter(n=>!entries.find(e=>e.name===n).dir).forEach((n,i)=>setTimeout(()=>download(n),i*400));
$('bCut').onclick=()=>{clip={items:[...sel].map(n=>join(cwd,n)),copy:false};say(sel.size+' élément(s) coupé(s)');render()};
$('bCopy').onclick=()=>{clip={items:[...sel].map(n=>join(cwd,n)),copy:true};say(sel.size+' élément(s) copié(s)');render()};
$('bPaste').onclick=act(async()=>{await post('/api/paste',{items:clip.items,dest:cwd,copy:clip.copy});if(!clip.copy)clip=null;await load()});
function rename(){
  const o=[...sel][0];if(!o)return;
  const tr=[...$('list').children].find(t=>t.firstChild.textContent===o);if(!tr)return;
  const td=tr.firstChild,i=document.createElement('input');
  tr.draggable=false;i.className='ren';i.value=o;td.textContent='';td.appendChild(i);i.focus();
  const dot=o.lastIndexOf('.');i.setSelectionRange(0,dot>0?dot:o.length);
  let done=false;
  const finish=async ok=>{
    if(done)return;done=true;
    const n=i.value.trim();
    if(!ok||!n||n===o){render();return}
    try{if(!okName(n))throw new Error('nom invalide');await post('/api/rename',{path:join(cwd,o),name:n});await load();sel.add(n);render()}
    catch(e){say('Erreur : '+e.message);render()}
  };
  i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')finish(true);else if(e.key==='Escape')finish(false)};
  i.onblur=()=>finish(true);
  i.onclick=i.ondblclick=e=>e.stopPropagation();
}
$('bRen').onclick=e=>{e.stopPropagation();rename()};
document.addEventListener('keydown',e=>{if(e.key==='F2'&&sel.size===1&&!/INPUT/.test(document.activeElement.tagName)){e.preventDefault();rename()}});
$('bDel').onclick=act(async()=>{if(!confirm('Supprimer '+sel.size+' élément(s) ? Action définitive.'))return;await post('/api/delete',{items:[...sel].map(n=>join(cwd,n))});await load()});
$('bShare').onclick=act(async()=>{const u=dlUrl([...sel][0]);try{await navigator.clipboard.writeText(u);say('Lien copié dans le presse-papiers')}catch{prompt('Copie le lien :',u)}});

async function upload(files){
  for(const f of files){
    say('Envoi de '+f.name+'...');$('progress').style.display='inline-block';$('progress').value=0;
    const {uploadId}=await post('/api/upload/start',{});
    try{
      const n=Math.max(1,Math.ceil(f.size/CHUNK));
      for(let i=0;i<n;i++){
        const r=await fetch('/api/upload/chunk/'+uploadId,{method:'PUT',body:f.slice(i*CHUNK,(i+1)*CHUNK)});
        if(!r.ok)throw new Error('échec envoi');
        $('progress').value=Math.round((i+1)/n*100);
      }
      await post('/api/upload/complete',{uploadId,dir:cwd,filename:f.name});
    }catch(e){await post('/api/upload/abort',{uploadId});say('Erreur : '+e.message);$('progress').style.display='none';return}
  }
  $('progress').style.display='none';say('Envoi terminé');load();
}
addEventListener('dragover',e=>{e.preventDefault();if(!drag)document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');if(drag){drag=null;return}upload([...e.dataTransfer.files])});
load();
</script></body></html>
